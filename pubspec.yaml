name: bezpecny_chat_meshtastic
description: Bezpečná LoRa komunikácia s Meshtastic, šifrovaním AES-256 a GPS
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.2
  flutter_blue_plus: ^1.36.8

  # UI
  cupertino_icons: ^1.0.2
  
  # Šifrovanie
  encrypt: ^5.0.3
  
  # Geolokácia
  geolocator: ^14.0.2
  
  # Sériová komunikácia - USB
  # Meshtastic
  meshtastic_flutter: ^0.0.3
  
  # Logger
  logger: ^2.0.0
  
  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  dbus: ^0.7.3